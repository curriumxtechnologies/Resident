<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account Suspended – Xynix Technologies</title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
    <style>
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .pulse-dot {
            animation: pulse-dot 1.8s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.85);
            }
        }

        .card-hover {
            transition: transform 0.2s ease;
        }
        .card-hover:hover {
            transform: translateY(-2px);
        }

        /* extra tiny screens */
        @media (max-width: 380px) {
            .card-pad {
                padding-left: 1rem !important;
                padding-right: 1rem !important;
            }
            .heading-size {
                font-size: 1.4rem !important;
            }
            .subhead-size {
                font-size: 0.9rem !important;
            }
        }
    </style>
</head>
<body>

    <div class="min-h-screen flex items-center justify-center bg-[#0b0d10] px-4 py-6">

        <div class="w-full max-w-[620px] bg-[#14181c] rounded-[2.25rem] px-6 sm:px-8 md:px-10 py-8 sm:py-10 md:py-12 border border-[#2a2f35] shadow-[0_30px_60px_-20px_rgba(0,0,0,0.8)] card-hover card-pad">

            <!-- badge -->
            <div class="inline-flex items-center gap-2 bg-[#1f262c] px-3 py-1.5 rounded-full border border-[#2d343b] mb-5 sm:mb-6">
                <span class="w-2 h-2 bg-[#f9735c] rounded-full pulse-dot"></span>
                <span class="text-[0.7rem] sm:text-xs font-semibold tracking-wide uppercase text-[#b6c4d0]">Suspension notice</span>
            </div>

            <!-- icon -->
            <div class="flex items-center justify-center w-14 h-14 sm:w-16 sm:h-16 bg-[#2a1c1a] rounded-xl sm:rounded-2xl border border-[#4d2e28] mb-5 sm:mb-6">
                <svg class="w-7 h-7 sm:w-8 sm:h-8 stroke-[#f9735c] stroke-[1.8] fill-none" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10" />
                    <line x1="12" y1="8" x2="12" y2="12" />
                    <line x1="12" y1="16" x2="12.01" y2="16" />
                </svg>
            </div>

            <!-- heading -->
            <h1 class="heading-size text-[1.6rem] sm:text-[1.8rem] md:text-[1.9rem] font-bold tracking-[-0.02em] text-[#f0f4f8] leading-tight mb-2">
                Account suspended
            </h1>

            <!-- subhead -->
            <p class="subhead-size text-sm sm:text-base text-[#a7b8c7] leading-relaxed mb-5 sm:mb-6">
                Your account has been suspended because of
                <strong class="text-[#e8edf2] font-semibold">failure to renew payment</strong>.
                Renew your payment to keep your website alive.
            </p>

            <!-- detail box – simplified -->
            <div class="bg-[#1a2025] rounded-2xl p-4 sm:p-5 border border-[#293035] mb-6 sm:mb-7">
                <div class="flex justify-between items-center text-sm sm:text-[0.9rem]">
                    <span class="text-[#8d9fae] font-medium">Account status</span>
                    <span class="text-[#f9735c] font-semibold">● Suspended</span>
                </div>
            </div>

            <!-- Contact support – primary action (opens Gmail) -->
            <a href="mailto:xynix.technologies@gmail.com?subject=Account%20Suspension%20-%20Renew%20Payment&body=Hello%20Xynix%20Technologies%2C%0A%0AI%20would%20like%20to%20renew%20my%20payment%20and%20reactivate%20my%20account.%20Please%20guide%20me%20through%20the%20process.%0A%0AThank%20you."
            class="inline-flex items-center justify-center gap-2.5 w-full py-3.5 sm:py-4 px-5 bg-[#f9735c] hover:bg-[#ff8a75] active:scale-[0.97] rounded-[60px] text-sm sm:text-[1.05rem] font-semibold text-[#0b0d10] transition-all duration-200 shadow-[0_8px_24px_-6px_rgba(249,115,92,0.25)] hover:shadow-[0_12px_32px_-8px_rgba(249,115,92,0.35)] no-underline">
            <svg class="w-5 h-5 stroke-current stroke-[2.2] fill-none" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                <polyline points="22,6 12,13 2,6" />
            </svg>
            Contact support
        </a>

        <!-- footer brand -->
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 sm:gap-0 mt-6 sm:mt-7 pt-4 sm:pt-5 border-t border-[#232a30]">
            <div class="flex items-center gap-2 text-[#cbd8e3] font-medium text-[0.75rem] sm:text-[0.8rem]">
                <svg class="w-[18px] h-[18px] stroke-current stroke-2 fill-none" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="2" width="20" height="20" rx="4" />
                    <path d="M8 12h8" />
                    <path d="M12 8v8" />
                </svg>
                <span>Xynix</span>
                <span class="text-[#5f737f] font-normal">Technologies</span>
            </div>
            <span class="text-[0.65rem] sm:text-[0.7rem] text-[#5f737f]">© 2026 · All rights reserved</span>
        </div>

    </div>
</div>

</body>
</html>
